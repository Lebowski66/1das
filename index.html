<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Магазин монет</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      color: #222;
    }
    .container {
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 10px;
    }
    .desc {
      text-align: center;
      margin-bottom: 20px;
      color: #666;
    }
    .product {
      background-color: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .product img {
      width: 48px;
      height: 48px;
      margin-right: 12px;
    }
    .info {
      flex-grow: 1;
    }
    .title {
      font-weight: bold;
      font-size: 18px;
    }
    .price {
      font-size: 16px;
      color: #444;
    }
    .buy-btn {
      background-color: #0088cc;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .buy-btn:hover {
      background-color: #0074b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Магазин</h1>
    <p class="desc">Пополните баланс с помощью нашей виртуальной валюты</p>

    <div class="product">
      <img src="https://em-content.zobj.net/thumbs/240/apple/354/money-bag_1f4b0.png" alt="Монеты">
      <div class="info">
        <div class="title">100 монет</div>
        <div class="price">₽99</div>
      </div>
      <button class="buy-btn" onclick="buy(100, 99)">Купить</button>
    </div>

    <div class="product">
      <img src="https://em-content.zobj.net/thumbs/240/apple/354/money-bag_1f4b0.png" alt="Монеты">
      <div class="info">
        <div class="title">500 монет</div>
        <div class="price">₽399</div>
      </div>
      <button class="buy-btn" onclick="buy(500, 399)">Купить</button>
    </div>

    <div class="product">
      <img src="https://em-content.zobj.net/thumbs/240/apple/354/money-bag_1f4b0.png" alt="Монеты">
      <div class="info">
        <div class="title">1000 монет</div>
        <div class="price">₽749</div>
      </div>
      <button class="buy-btn" onclick="buy(1000, 749)">Купить</button>
    </div>
  </div>

  <script>
    function buy(coins, price) {
      const payload = {
        coins,
        price,
        time: new Date().toISOString()
      };

      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.sendData(JSON.stringify(payload));
      } else {
        alert("Вы вне Telegram, данные: " + JSON.stringify(payload));
      }
    }

    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.expand(); // Разворачивает Web App на весь экран
    }
  </script>
</body>
</html>
