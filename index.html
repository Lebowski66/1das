<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Telegram Shop</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
    .product { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-bottom: 20px; background: #fff; }
    .product img { max-width: 100%; border-radius: 8px; }
    .product h3 { margin: 10px 0 5px; }
    .product p { margin: 5px 0; }
    .product button { padding: 10px 20px; background: #0088cc; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    .product button:hover { background: #006699; }
  </style>
</head>
<body>
  <h2>Каталог товаров</h2>

  <div class="product">
    <img src="https://via.placeholder.com/300x200?text=Товар+1" alt="Товар 1">
    <h3>Кроссовки Puma</h3>
    <p>Цена: 8500 ₽</p>
    <button onclick="buy('Кроссовки Puma', 8500)">Купить</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/300x200?text=Товар+2" alt="Товар 2">
    <h3>Футболка Nike</h3>
    <p>Цена: 3500 ₽</p>
    <button onclick="buy('Футболка Nike', 3500)">Купить</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    function buy(name, price) {
      if (tg) {
        const order = {
          product: name,
          price: price,
          date: new Date().toLocaleString()
        };
        tg.sendData(JSON.stringify(order));
      } else {
        alert("Telegram WebApp API недоступен.");
      }
    }
  </script>
</body>
</html>
